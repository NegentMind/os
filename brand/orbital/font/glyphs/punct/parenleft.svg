<!-- Orbital glyph parenleft (() — stroke 13, bevel joins, lines y=16/56/96.
     descender y=116. v0.4.1: chevron construction (vertex at optical
     center y=66) replaces the thin half-ellipse — the angular bracket is
     native to the bevel/line grammar and survives mid sizes.
     Source of truth for this mark; build-font.py consumes it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 120">
  <path d="M46,16 L16,66 L46,116" fill="none" stroke="currentColor" stroke-width="13" stroke-linejoin="bevel"/>
</svg>
