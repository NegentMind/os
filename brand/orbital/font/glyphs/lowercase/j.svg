<!-- Orbital glyph j (lowercase) — stroke 13, bevel joins.
     x-height y=56, baseline y=96, ascender y=16, descender y=116.
     Bowl/arches r20 centered (32,76); dot = filled r6 (registration dot).
     Source of truth for this letterform; build-font.py consumes it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 120">
  <path d="M26,56 V96 A20,20 0 0 1 6,116" fill="none" stroke="currentColor" stroke-width="13" stroke-linejoin="bevel"/>
  <circle cx="26" cy="34" r="6" stroke="none" fill="currentColor"/>
</svg>
