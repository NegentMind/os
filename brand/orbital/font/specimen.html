<!doctype html>
<!-- Orbital font specimen — development plate for glyph review.
     The GLYPHS table below is the working source; glyphs/*.svg mirror it.
     Construction contract: stroke 13, bevel joins, lines y=16/56/96,
     curve families r30 (G) / r40 (D) / r20 bowls. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Orbital — specimen</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 32px; background: #070809; color: #f1f3f5;
         font-family: system-ui, sans-serif; }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #adb5c0; }
  h2 { font-size: 11px; font-weight: 500; color: #6b7280; margin: 28px 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; }
  .cell { width: 92px; padding: 8px 4px 6px; text-align: center; }
  .cell svg { width: 100%; height: auto; color: #f1f3f5; }
  .cell span { display: block; font: 10px/1.4 ui-monospace, monospace; color: #6b7280; margin-top: 4px; }
  .word { margin: 6px 0; }
  .word svg { height: 56px; width: auto; color: #f1f3f5; }
  .word.lg svg { height: 96px; }
  .word.sm svg { height: 28px; }
  .word label { display: block; font: 10px/1.4 ui-monospace, monospace; color: #6b7280; margin-bottom: 2px; }
  .paper { background: #fff; padding: 16px; border-radius: 8px; }
  .paper .word svg { color: #111418; }
  .grid { position: relative; }
  .grid svg text { fill: #343b46; font: 4px ui-monospace, monospace; }
</style>
</head>
<body>
<h1>Orbital — glyph table draft</h1>
<h2>Alphabet A–Z (cell shows glyph width)</h2>
<div class="row" id="alphabet"></div>
<h2>Logo composition (reference paths verbatim)</h2>
<div class="word lg"><label>NEGENT MIND.</label><svg id="logo"></svg></div>
<h2>Rotating words — ES</h2>
<div class="word"><label>MEMORIA</label><svg data-word="MEMORIA"></svg></div>
<div class="word"><label>OJOS</label><svg data-word="OJOS"></svg></div>
<div class="word"><label>VOZ</label><svg data-word="VOZ"></svg></div>
<div class="word"><label>MANOS</label><svg data-word="MANOS"></svg></div>
<h2>Rotating words — EN</h2>
<div class="word"><label>MEMORY</label><svg data-word="MEMORY"></svg></div>
<div class="word"><label>SIGHT</label><svg data-word="SIGHT"></svg></div>
<div class="word"><label>VOICE</label><svg data-word="VOICE"></svg></div>
<div class="word"><label>HANDS</label><svg data-word="HANDS"></svg></div>
<h2>Pangram checks</h2>
<div class="word"><label>QUICK BROWN FOX JUMPS LAZY</label><svg data-word="QUICK BROWN FOX JUMPS LAZY"></svg></div>
<div class="word"><label>WALTZ BAD NYMPH QUICK JIGS VEX</label><svg data-word="WALTZ BAD NYMPH QUICK JIGS VEX"></svg></div>
<h2>Paper surface</h2>
<div class="paper">
  <div class="word"><label>MEMORIA · VOZ</label><svg data-word="MEMORIA VOZ"></svg></div>
</div>
<script>
const GLYPHS = {
  A: { d: "M10,96 L34,16 L58,96 M20,68 H48", w: 68 },
  B: { d: "M12,96 V16 H34 A20,20 0 0 1 34,56 H12 H40 A20,20 0 0 1 40,96 H12 Z", w: 72 },
  C: { d: "M74.6,30.3 A40,40 0 1 0 74.6,81.7", w: 82 },
  D: { d: "M12,16 V96 H38 A40,40 0 0 0 38,16 H12 Z", w: 84 },
  E: { d: "M52,16 H12 V96 H52 M12,56 H44", w: 64 },
  F: { d: "M52,16 H12 V96 M12,56 H44", w: 64 },
  G: { d: "M68,34 A30,30 0 1 0 74,56 H46", w: 80 },
  H: { d: "M12,16 V96 M56,16 V96 M12,56 H56", w: 68 },
  I: { d: "M18,16 V96", w: 36 },
  J: { d: "M56,16 V76 A20,20 0 0 1 16,76", w: 68 },
  K: { d: "M12,16 V96 M58,16 L14,56 L60,96", w: 72 },
  L: { d: "M12,16 V96 H56", w: 66 },
  M: { d: "M12,96 V16 L40,62 L68,16 V96", w: 80 },
  N: { d: "M12,96 V16 L56,96 V16", w: 68 },
  O: { d: "M38,16 A30,40 0 1 0 38,96 A30,40 0 1 0 38,16 Z", w: 78 },
  P: { d: "M12,96 V16 H38 A20,20 0 0 1 38,56 H12 Z", w: 70 },
  Q: { d: "M38,16 A30,40 0 1 0 38,96 A30,40 0 1 0 38,16 Z M50,76 L74,102", w: 82 },
  R: { d: "M12,96 V16 H38 A20,20 0 0 1 38,56 H12 Z M36,56 L62,96", w: 74 },
  S: { d: "M56,36 A20,20 0 0 0 16,36 L56,76 A20,20 0 0 1 16,76", w: 72 },
  T: { d: "M6,16 H58 M32,16 V96", w: 64 },
  U: { d: "M12,16 V72 A24,24 0 0 0 60,72 V16", w: 72 },
  V: { d: "M10,16 L34,96 L58,16", w: 68 },
  W: { d: "M12,16 V96 L40,50 L68,96 V16", w: 80 },
  X: { d: "M12,16 L60,96 M60,16 L12,96", w: 72 },
  Y: { d: "M8,16 L34,56 L60,16 M34,56 V96", w: 68 },
  Z: { d: "M12,16 H56 L12,96 H58", w: 70 },
};
const GAP = 16;
const NS = "http://www.w3.org/2000/svg";

function glyphPaths(letter, dx) {
  const g = GLYPHS[letter];
  if (!g) return null;
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", g.d);
  if (dx) p.setAttribute("transform", `translate(${dx},0)`);
  return p;
}

function wordSvg(word, target) {
  let x = 0;
  const paths = [];
  for (const ch of word) {
    if (ch === " ") { x += 34; continue; }
    const g = GLYPHS[ch];
    if (!g) { x += 40; continue; }
    const p = glyphPaths(ch, x);
    paths.push(p);
    x += g.w + GAP;
  }
  x -= GAP;
  target.setAttribute("viewBox", `0 0 ${x} 120`);
  const g = document.createElementNS(NS, "g");
  g.setAttribute("fill", "none");
  g.setAttribute("stroke", "currentColor");
  g.setAttribute("stroke-width", "13");
  g.setAttribute("stroke-linejoin", "bevel");
  for (const p of paths) g.appendChild(p);
  target.appendChild(g);
}

const alpha = document.getElementById("alphabet");
for (let i = 65; i <= 90; i++) {
  const ch = String.fromCharCode(i);
  const g = GLYPHS[ch];
  const cell = document.createElement("div");
  cell.className = "cell";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 96 120");
  const grp = document.createElementNS(NS, "g");
  grp.setAttribute("fill", "none");
  grp.setAttribute("stroke", "currentColor");
  grp.setAttribute("stroke-width", "13");
  grp.setAttribute("stroke-linejoin", "bevel");
  grp.appendChild(glyphPaths(ch, Math.max(0, (96 - g.w) / 2)));
  svg.appendChild(grp);
  cell.appendChild(svg);
  const label = document.createElement("span");
  label.textContent = `${ch} · w${g.w}`;
  cell.appendChild(label);
  alpha.appendChild(cell);
}

// Logo verbatim from orbital-source.svg
const logo = document.getElementById("logo");
logo.setAttribute("viewBox", "0 0 836 120");
logo.innerHTML = `<g fill="none" stroke="currentColor" stroke-width="13" stroke-linejoin="bevel">
  <path d="M12,96 V16 L56,96 V16"/>
  <path transform="translate(80,0)" d="M52,16 H12 V96 H52 M12,56 H44"/>
  <path transform="translate(154,0)" d="M68,34 A30,30 0 1 0 74,56 H46"/>
  <path transform="translate(248,0)" d="M52,16 H12 V96 H52 M12,56 H44"/>
  <path transform="translate(322,0)" d="M12,96 V16 L56,96 V16"/>
  <path transform="translate(402,0)" d="M6,16 H58 M32,16 V96"/>
  <path transform="translate(506,0)" d="M12,96 V16 L40,62 L68,16 V96"/>
  <path transform="translate(596,0)" d="M18,16 V96"/>
  <path transform="translate(642,0)" d="M12,96 V16 L56,96 V16"/>
  <path transform="translate(722,0)" d="M12,16 V96 H38 A40,40 0 0 0 38,16 H12 Z"/>
  <circle cx="822" cy="92" r="6" stroke="none" fill="currentColor"/>
</g>`;

document.querySelectorAll("svg[data-word]").forEach((svg) => wordSvg(svg.dataset.word, svg));
</script>
</body>
</html>
