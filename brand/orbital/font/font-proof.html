<!doctype html>
<!-- Renders the compiled orbital-display.ttf/woff2 for visual proof. -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Orbital Display — font proof</title>
<style>
  @font-face {
    font-family: "Orbital Display";
    src: url("orbital-display.woff2") format("woff2"),
         url("orbital-display.ttf") format("truetype");
  }
  body { margin: 0; padding: 32px; background: #070809; color: #f1f3f5;
         font-family: "Orbital Display", sans-serif; }
  .size-1 { font-size: 32px; }
  .size-2 { font-size: 64px; }
  .size-3 { font-size: 120px; }
  p { margin: 0 0 12px; }
  .paper { background: #fff; color: #111418; padding: 16px; border-radius: 8px; }
</style>
</head>
<body>
<p class="size-3">NEGENT MIND.</p>
<p class="size-2">ABCDEFGHIJKLMNOPQRSTUVWXYZ</p>
<p class="size-1">MEMORIA OJOS VOZ MANOS</p>
<p class="size-1">MEMORY SIGHT VOICE HANDS</p>
<div class="paper"><p class="size-2">MEMORIA. VOZ</p></div>
</body>
</html>
